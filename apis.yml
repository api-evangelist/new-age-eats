aid: new-age-eats
name: New Age Eats
description: >-
  New Age Eats (founded 2018 in Berkeley, California as New Age Meats, rebranded to New Age Eats in
  2022) was a cultivated-meat startup building cell-cultured pork sausage, combining plant protein
  with its own cultivated pork and a "sensomics" flavor program. It raised roughly $32 million,
  including a $25 million Series A in 2021 led by Hanwha Solutions, and was completing a pilot
  manufacturing plant in Alameda, California. Founder and CEO Brian Spears announced the company was
  winding down in March 2023, citing an inability to raise further capital in a turbulent market
  before it had any product to sell. It was a food-science company, never a software or API company:
  it published no developer portal, no documentation, no SDKs and no machine-readable contract of any
  kind. Its remaining domain, newageeats.com, now serves a static archived copy of the former
  direct-to-consumer marketing site; the pre-rebrand domain newagemeats.com redirects to a host that
  no longer resolves.
